<script>
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const COLORS = ['#2c2416','#c0392b','#2980b9','#27ae60','#8e44ad','#e67e22','#e91e8c'];
const COLOR_NAMES = ['default','red','blue','green','purple','orange','pink'];
const PLACEHOLDERS = [
  "What's on your mind today?",
  "How are you feeling today?",
  "What happened today?",
  "Your thoughts for today...",
  "Write freely here..."
];

const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth();

// day -> HTML content for the month currently being viewed (populated by one Firestore query)
let monthEntryCache = {};
// debounce timers per entry id
const saveTimers = {};

function entryId(y, m, d) { return `${y}_${m + 1}_${d}`; }
function monthKeyOf(y, m) { return `${y}-${String(m + 1).padStart(2, '0')}`; }
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function isToday(y, m, d) {
  return y === now.getFullYear() && m === now.getMonth() && d === now.getDate();
}

function setSaveStatus(text, ok = true) {
  const dot = document.getElementById('saveDot');
  const label = document.getElementById('saveStatus');
  if (label) label.textContent = text;
  if (dot) dot.style.background = ok ? '#7bc67e' : '#e0a83a';
}

// ---------- Firestore: load / save ----------

async function loadMonthEntries(year, month) {
  const { db, getDocs, collection, query, where } = window.__fb;
  const map = {};
  try {
    const q = query(collection(db, 'entries'), where('yearMonth', '==', monthKeyOf(year, month)));
    const snap = await getDocs(q);
    snap.forEach(d => {
      const data = d.data();
      const parts = d.id.split('_'); // y_m_d
      const day = parseInt(parts[2], 10);
      if (!Number.isNaN(day)) map[day] = data.content || '';
    });
  } catch (err) {
    console.error('Gagal memuat entri bulan ini:', err);
    setSaveStatus('Gagal memuat data', false);
  }
  return map;
}

function scheduleSave(id, year, month, html) {
  setSaveStatus('Menyimpan...', false);
  clearTimeout(saveTimers[id]);
  saveTimers[id] = setTimeout(() => saveEntryNow(id, year, month, html), 600);
}

async function saveEntryNow(id, year, month, html) {
  const { db, doc, setDoc, serverTimestamp } = window.__fb;
  try {
    await setDoc(doc(db, 'entries', id), {
      content: html,
      yearMonth: monthKeyOf(year, month),
      updatedAt: serverTimestamp()
    }, { merge: true });
    setSaveStatus('Synced to cloud', true);
  } catch (err) {
    console.error('Gagal menyimpan entri:', err);
    setSaveStatus('Gagal menyimpan — cek koneksi', false);
  }
}

// ---------- Card rendering ----------

function createCard(year, month, day) {
  const date = new Date(year, month, day);
  const dayName = DAYS[date.getDay()];
  const today = isToday(year, month, day);
  const id = entryId(year, month, day);
  const saved = monthEntryCache[day] || '';
  const placeholder = PLACEHOLDERS[day % PLACEHOLDERS.length];

  const card = document.createElement('div');
  card.className = 'day-card';
  card.id = `day-${day}`;

  card.innerHTML = `
    <div class="day-header">
      <span class="day-name">${dayName}</span>
      <span class="day-num${today ? ' today' : ''}">${day}</span>
      ${today ? '<span class="today-badge">today</span>' : ''}
    </div>
    <div class="toolbar">
      <button class="tool-btn" data-cmd="bold" title="Bold"><b>B</b></button>
      <button class="tool-btn italic-i" data-cmd="italic" title="Italic">I</button>
      <button class="tool-btn strike-s" data-cmd="strikeThrough" title="Strikethrough">S</button>
      <div class="tool-sep"></div>
      ${COLORS.map((c,i) => `<button class="color-btn" style="background:${c}" data-color="${c}" title="${COLOR_NAMES[i]}"></button>`).join('')}
    </div>
    <div class="editor-area" contenteditable="true" data-placeholder="${placeholder}" spellcheck="false">${saved}</div>
    <div class="char-count"><span class="wc">0</span> words</div>
  `;

  const editor = card.querySelector('.editor-area');
  const wc = card.querySelector('.wc');

  function countWords() {
    const t = editor.innerText.trim();
    wc.textContent = t ? t.split(/\s+/).length : 0;
  }
  if (saved) countWords();

  editor.addEventListener('input', () => {
    countWords();
    scheduleSave(id, year, month, editor.innerHTML);
  });

  editor.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 'b' || e.key === 'B') { e.preventDefault(); document.execCommand('bold', false, null); updateStates(card); }
      if (e.key === 'i' || e.key === 'I') { e.preventDefault(); document.execCommand('italic', false, null); updateStates(card); }
      if (e.key === 'u' || e.key === 'U') { e.preventDefault(); document.execCommand('underline', false, null); updateStates(card); }
    }
  });

  editor.addEventListener('focus', () => { editor.spellcheck = true; });
  editor.addEventListener('blur', () => { editor.spellcheck = false; });

  card.querySelectorAll('.tool-btn').forEach(btn => {
    if (!btn.dataset.cmd) return;
    btn.addEventListener('mousedown', e => {
      e.preventDefault();
      editor.focus();
      document.execCommand(btn.dataset.cmd, false, null);
      updateStates(card);
    });
  });

  // Paste: plain text only. Images pasted from clipboard are intentionally
  // ignored — this app is text-only, no image storage involved.
  editor.addEventListener('paste', (e) => {
    const text = e.clipboardData.getData('text/plain').trim();
    const urlPattern = /^(https?:\/\/)[^\s]+$/;
    if (urlPattern.test(text)) {
      e.preventDefault();
      const a = document.createElement('a');
      a.href = text; a.textContent = text; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.style.color = 'var(--accent)';
      const sel = window.getSelection();
      if (sel.rangeCount) {
        const range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(a);
        range.setStartAfter(a);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      } else {
        editor.appendChild(a);
      }
      scheduleSave(id, year, month, editor.innerHTML);
    }
  });

  card.querySelectorAll('.color-btn').forEach(btn => {
    btn.addEventListener('mousedown', e => {
      e.preventDefault();
      editor.focus();
      if (window.getSelection().toString().length > 0) {
        document.execCommand('foreColor', false, btn.dataset.color);
      }
      card.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active-color'));
      btn.classList.add('active-color');
    });
  });

  editor.addEventListener('keyup', () => updateStates(card));
  editor.addEventListener('mouseup', () => updateStates(card));

  return card;
}

function updateStates(card) {
  card.querySelectorAll('.tool-btn').forEach(btn => {
    try { btn.classList.toggle('active', document.queryCommandState(btn.dataset.cmd)); } catch(e){}
  });
}

async function render() {
  document.getElementById('monthSelect').value = MONTHS[viewMonth];
  document.getElementById('yearSelect').value = viewYear;
  setSaveStatus('Memuat...', false);
  monthEntryCache = await loadMonthEntries(viewYear, viewMonth);

  const container = document.getElementById('daysContainer');
  container.innerHTML = '';
  const days = daysInMonth(viewYear, viewMonth);
  let count = 0;
  for (let d = 1; d <= days; d++) {
    if (monthEntryCache[d]) count++;
    container.appendChild(createCard(viewYear, viewMonth, d));
  }
  document.getElementById('monthTitle').textContent = `${MONTHS[viewMonth]} ${viewYear}`;
  document.getElementById('entryCount').textContent = count ? `${count} entr${count > 1 ? 'ies' : 'y'} this month` : '';
  setSaveStatus('Synced to cloud', true);

  if (isToday(viewYear, viewMonth, now.getDate())) {
    setTimeout(() => {
      const todayCard = document.getElementById(`day-${now.getDate()}`);
      if (todayCard) todayCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 150);
  }
}

const yearSelect = document.getElementById('yearSelect');
for (let y = 2026; y <= 2035; y++) {
  const opt = document.createElement('option');
  opt.value = y; opt.textContent = y;
  yearSelect.appendChild(opt);
}

document.getElementById('monthSelect').addEventListener('change', (e) => {
  viewMonth = MONTHS.indexOf(e.target.value);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('yearSelect').addEventListener('change', (e) => {
  viewYear = parseInt(e.target.value);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('prevBtn').addEventListener('click', () => {
  viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('nextBtn').addEventListener('click', () => {
  viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ---------- Export: pull every entry out of Firestore ----------
document.getElementById('exportBtn').addEventListener('click', async () => {
  const { db, getDocs, collection } = window.__fb;
  setSaveStatus('Menyiapkan export...', false);
  try {
    const snap = await getDocs(collection(db, 'entries'));
    const data = {};
    snap.forEach(d => { data[`diary_${d.id}`] = d.data().content || ''; });
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `diary_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    setSaveStatus('Synced to cloud', true);
  } catch (err) {
    console.error(err);
    alert('Gagal export data.');
    setSaveStatus('Export gagal', false);
  }
});

// ---------- Import ----------
// This app is text-only. Old backups may still contain base64 <img> tags
// (from a previous version that supported photos) — those are stripped out
// on import so nothing large ever lands in Firestore. Only the text content
// is kept.
document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

function stripImages(html) {
  const wrapper = document.createElement('div');
  wrapper.innerHTML = html;
  // Remove image wrapper spans (from the old rich editor) and any bare <img>
  wrapper.querySelectorAll('.img-resize-wrap, img').forEach(el => el.remove());
  return wrapper.innerHTML;
}

document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const { db, doc, setDoc, serverTimestamp } = window.__fb;
    try {
      const data = JSON.parse(ev.target.result);
      let count = 0;
      let imagesStripped = 0;
      const entries = Object.entries(data).filter(([key]) => key.startsWith('diary_') && key !== 'diary_theme');
      setSaveStatus(`Mengimpor 0/${entries.length}...`, false);
      for (const [key, value] of entries) {
        const id = key.replace(/^diary_/, ''); // y_m_d
        const parts = id.split('_');
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        if (Number.isNaN(y) || Number.isNaN(m)) continue;
        const hadImage = /data:image|img-resize-wrap|<img/.test(value);
        const cleanHtml = stripImages(value);
        if (hadImage) imagesStripped++;
        await setDoc(doc(db, 'entries', id), {
          content: cleanHtml,
          yearMonth: monthKeyOf(y, m),
          updatedAt: serverTimestamp()
        }, { merge: true });
        count++;
        setSaveStatus(`Mengimpor ${count}/${entries.length}...`, false);
      }
      const note = imagesStripped > 0 ? ` (${imagesStripped} entry berisi gambar — gambarnya dibuang, teksnya tetap masuk.)` : '';
      alert(`Imported ${count} entries successfully!${note}`);
      setSaveStatus('Synced to cloud', true);
      render();
    } catch (err) {
      console.error(err);
      alert('Could not read file. Make sure it is a valid diary backup.');
      setSaveStatus('Import gagal', false);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('themeToggle').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  localStorage.setItem('diary_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
});

if (localStorage.getItem('diary_theme') === 'dark') document.body.classList.add('dark');

const floatToolbar = document.getElementById('floatToolbar');
floatToolbar.addEventListener('mousedown', (e) => { e.preventDefault(); });

document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.toString().trim() === '') {
    floatToolbar.classList.remove('visible');
    return;
  }
  const anchor = sel.anchorNode;
  if (!anchor) { floatToolbar.classList.remove('visible'); return; }
  const editorEl = anchor.nodeType === 3
    ? anchor.parentElement.closest('.editor-area')
    : anchor.closest && anchor.closest('.editor-area');
  if (!editorEl) { floatToolbar.classList.remove('visible'); return; }

  try {
    const range = sel.getRangeAt(0);
    const rects = range.getClientRects();
    if (!rects || rects.length === 0) return;
    const rect = rects[rects.length - 1];
    const tbWidth = 290;
    let left = rect.left + (rect.width / 2) - (tbWidth / 2);
    left = Math.max(8, Math.min(left, window.innerWidth - tbWidth - 8));
    let top = rect.top - 52 + window.scrollY;
    if (top < window.scrollY + 8) top = rect.bottom + window.scrollY + 8;
    floatToolbar.style.left = left + 'px';
    floatToolbar.style.top = top + 'px';
    floatToolbar.classList.add('visible');
  } catch(e) {
    floatToolbar.classList.remove('visible');
  }
});

floatToolbar.querySelectorAll('[data-fcmd]').forEach(btn => {
  btn.addEventListener('mousedown', (e) => { e.preventDefault(); document.execCommand(btn.dataset.fcmd, false, null); });
});

floatToolbar.querySelectorAll('[data-fcolor]').forEach(btn => {
  btn.addEventListener('mousedown', (e) => {
    e.preventDefault();
    document.execCommand('foreColor', false, btn.dataset.fcolor);
    floatToolbar.classList.remove('visible');
  });
});

// ---------- PIN gate ----------

function showApp() {
  document.getElementById('pinOverlay').classList.add('hidden');
  document.getElementById('appShell').classList.remove('locked');
  render();
}

function showPinScreen() {
  document.getElementById('appShell').classList.add('locked');
  document.getElementById('pinOverlay').classList.remove('hidden');
  document.getElementById('pinInput').value = '';
  document.getElementById('pinError').textContent = '';
  document.getElementById('pinInput').focus();
}

async function submitPin() {
  const pinInput = document.getElementById('pinInput');
  const pinError = document.getElementById('pinError');
  const submitBtn = document.getElementById('pinSubmit');
  const pin = pinInput.value.trim();
  if (!pin) return;
  submitBtn.disabled = true;
  pinError.textContent = '';
  try {
    const res = await fetch('/api/verify-pin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin })
    });
    const result = await res.json();
    if (!res.ok || !result.token) {
      pinError.textContent = result.error || 'PIN salah, coba lagi.';
      submitBtn.disabled = false;
      return;
    }
    await window.__fb.signInWithCustomToken(window.__fb.auth, result.token);
    // onAuthStateChanged listener below will call showApp()
  } catch (err) {
    console.error(err);
    pinError.textContent = 'Gagal terhubung ke server. Coba lagi.';
    submitBtn.disabled = false;
  }
}

function initAuthGate() {
  document.getElementById('pinSubmit').addEventListener('click', submitPin);
  document.getElementById('pinInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitPin();
  });
  document.getElementById('lockBtn').addEventListener('click', async () => {
    await window.__fb.signOut(window.__fb.auth);
  });

  window.__fb.onAuthStateChanged(window.__fb.auth, (user) => {
    document.getElementById('pinSubmit').disabled = false;
    if (user) {
      showApp();
    } else {
      showPinScreen();
    }
  });
}

function start() {
  initAuthGate();
}

if (window.__fbReady) {
  start();
} else {
  window.addEventListener('fb-ready', start);
}

</script>
